plugins:
  # Хост A: только calculator (утилита). Нет agent — поэтому ответы на
  # tool-вызовы (target=agent:demo) не находят локального получателя и
  # форвардятся по сети обратно на хост-инициатор B через net-мост.
  - file: "plugins/tool_calculator_plugin/target/wasm32-wasip2/debug/tool_calculator_plugin.wasm"
    name: "tool:calculator"
    access: []
    config: {}
    allow_background: false

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Хост A: держит calculator локально, слушает входящий /net на 8092.
net:
  node_id: "host-a"
  listen_port: 8092
  token: "secret-a"
  remotes: []
