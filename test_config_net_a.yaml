plugins:
  # Хост A: консоль + локальный инструмент calculator.
  # (Практический сценарий: локальный фронт с утилитами.)
  - file: "plugins/front_console_plugin/target/wasm32-wasip2/debug/front_console_plugin.wasm"
    name: "front:console"
    access:
      - !console_input "prompt> "
      - !console_print 102400
    config:
      subscriptions: ["system:info", "system:error"]
      targets: ["system:info"]
      mode: "wait"
    allow_background: true

  - file: "plugins/tool_calculator_plugin/target/wasm32-wasip2/debug/tool_calculator_plugin.wasm"
    name: "tool:calculator"
    access: []
    config: {}
    allow_background: false

  # Для неинтерактивного теста: HTTP-фронт на A (вместо консоли).
  - file: "plugins/front_http_plugin/target/wasm32-wasip2/debug/front_http_plugin.wasm"
    name: "front:http"
    access: []
    config:
      listeners:
        - port: 8090
          path: "/query"
          target: "agent:demo"
    allow_background: true

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Хост A: консоль + calculator. Это КЛИЕНТ — подключается к серверу B,
# сам сеть не слушает (listen_port=0). WebSocket двунаправленный: B отвечает
# по этому же соединению.
net:
  node_id: "00000000-0000-0000-0000-0000000000a1"
  listen_port: 0
  token: []
  remotes:
    - url: "ws://127.0.0.1:8093/net"
      token: "secret-client-1"
      targets: ["agent:demo"]
