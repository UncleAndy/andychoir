[package]
name = "andychoir"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "plugins/*"
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasmtime = { version = "46.0", features = ["async", "component-model"] }
wasmtime-wasi = { version = "46.0", features = ["p2"] }
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dashmap = "7.0.0-rc2"
