[package]
name = "andychoir"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
wasmtime = { version = "46.0", features = ["async", "component-model"] }
wasmtime-wasi = { version = "46.0", features = ["p2"] }
tokio-metrics = "0.5"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dashmap = "7.0.0-rc2"
rustyline = "18.0"
log = "0.4"
flexi_logger = "0.31"
chrono = "0.4.45"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.7", features = ["ws"] }

[dev-dependencies]
filetime = "0.2"

