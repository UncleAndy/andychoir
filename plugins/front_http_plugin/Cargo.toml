[package]
name = "front_http_plugin"
version = "0.1.0"
edition = "2024"

[lib]
# Важно: cdylib указывает компилятору собрать динамическую C-библиотеку,
# которую затем утилиты WASM превращают в компонент.
# rlib добавлен, чтобы можно было запускать cargo test (unit-тесты) под host.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v4"] }
dashmap = "7.0.0-rc2"
