[package]
name = "front_console_plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UncleAndy/andychoir"
authors = ["Andrey Velikoredchanin"]

[lib]
# Важно: cdylib указывает компилятору собрать динамическую C-библиотеку,
# которую затем утилиты WASM превращают в компонент.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v4"] }
