[package]
name = "front_ws_plugin"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib: для wasm-компонента. rlib: чтобы можно было запускать cargo test (unit).
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23.4", features = ["v4"] }
dashmap = "7.0.0-rc2"
