[package]
name = "tool_env_plugin"
version = "0.1.0"
edition = "2024"
description = "Tool plugin: host environment (current time, env vars, system info)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UncleAndy/andychoir"
authors = ["Andrey Velikoredchanin"]
resolver = "2"

[lib]
# cdylib: the WASM component is produced from a dynamic library.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
