[package]
name = "mcp_client_plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UncleAndy/andychoir"
authors = ["Andrey Velikoredchanin"]

[lib]
# cdylib: для wasm-компонента. rlib: чтобы можно было запускать cargo test (unit).
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "7.0.0-rc2"
