plugins:
  # Хост B: только агент (удалённый LLM-обработчик).
  # Агент использует инструмент calculator, который живёт на хосте A
  # (доступен через сетевой мост, привязывается к сессии динамически).
  - file: "plugins/agent_plugin/target/wasm32-wasip2/debug/agent_plugin.wasm"
    name: "agent:demo"
    access: []
    config:
      name: "demo"
      model:
        model_name: "gemma4:cloud"
        api_url: "http://localhost:11434/v1"
        api_key: null
      system_prompt: "You are a helpful assistant."
      tools: ["calculator"]
    allow_background: true

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Хост B: только агент, слушает /net на 8093 и подключается к A (консоль+инструменты).
net:
  node_id: "host-b"
  listen_port: 8093
  token: "secret-b"
  remotes:
    - url: "ws://127.0.0.1:8092/net"
      token: "secret-a"
      targets: ["tool:calculator", "front:console"]
