plugins:
  # Host B: RELAY only. Listens on 8091, dials nobody (remotes: []).
  # A and C both dial B; B forwards events between them by FIB.
  - file: "plugins/agent_plugin/target/wasm32-wasip2/debug/agent_plugin.wasm"
    name: "agent:demo"
    access: []
    config:
      name: "demo"
      model:
        model_name: "gemma4:cloud"
        api_url: "http://localhost:11434/v1"
        api_key: null
      system_prompt: "You are a helpful assistant."
      tools: ["calculator"]
    allow_background: true

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Host B: relay. SERVER — listens on 8091, accepts A and C (tokens),
# dials nobody. See docs/NET-concept.md §8.
net:
  node_id: "00000000-0000-0000-0000-0000000000b2"
  listen_port: 8091
  connect_retry_interval_secs: 10   # default; здесь remotes пуст, не используется
  connect_timeout_secs: 300
  token:
    - "secret-b"
    - "secret-c"
  remotes: []
