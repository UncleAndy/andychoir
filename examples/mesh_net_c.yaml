plugins:
  # Host C: only calculator tool. CLIENT — dials B (relay), listen_port=0.
  # Reachable from A purely via FIB (A->B->C). See docs/NET-concept.md §8.
  - file: "plugins/tool_calculator_plugin/target/wasm32-wasip2/debug/tool_calculator_plugin.wasm"
    name: "tool:calculator"
    access: []
    config: {}
    allow_background: false

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Host C: calculator. CLIENT — dials B, does not listen. See docs/NET-concept.md §8.
# mTLS (OPTIONAL, see docs/NET-concept.md §8.6): wss:// + mtls block.
net:
  node_id: "00000000-0000-0000-0000-0000000000c3"
  listen_port: 0
  connect_retry_interval_secs: 10   # пауза между попытками (default 10)
  connect_timeout_secs: 300         # окно отказа 5 мин; 0 = вечно
  token: []
  mtls:
    enabled: true
    dir: "./certs"
    require_node_id_in_san: true
  remotes:
    - url: "wss://127.0.0.1:8091/net"
      token: "secret-c"
      targets: []
      retry_interval_secs: 0
      connect_timeout_secs: 0
