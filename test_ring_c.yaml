plugins:
  # Нода C: ТОЛЬКО калькулятор. Без агента/фронта.
  - file: "plugins/tool_calculator_plugin/target/wasm32-wasip2/debug/tool_calculator_plugin.wasm"
    name: "tool:calculator"
    access: []
    config: {}
    allow_background: false

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9092
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Нода C (калькулятор): слушает 8094, подключается к A (8092).
# Кольцо: A -> B -> C -> A (замыкается на A).
net:
  node_id: "00000000-0000-0000-0000-0000000000c3"
  listen_port: 8094
  connect_retry_interval_secs: 10
  connect_timeout_secs: 300
  token:
    - "secret-c"
  remotes:
    - url: "ws://127.0.0.1:8092/net"   # следующая нода в кольце: A (замыкание)
      token: "secret-a"
      targets: []
      retry_interval_secs: 0
      connect_timeout_secs: 0
