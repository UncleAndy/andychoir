plugins:
  # Нода A: ТОЛЬКО фронт-терминал (консоль). Без локальных инструментов/агента.
  - file: "plugins/front_console_plugin/target/wasm32-wasip2/debug/front_console_plugin.wasm"
    name: "front:console"
    access:
      - !console_input "prompt> "
      - !console_print 102400
    config:
      subscriptions: ["system:info", "system:error", "tool:calculator"]
      targets: [".*"]          # подписка на всё; агент и калькулятор — на других нодах
      mode: "wait"
    allow_background: true

metrics:
  enabled: false
  host: "127.0.0.1"
  port: 9090
  update_interval_secs: 15
  location: "/metrics"

startup:
  timeout_secs: 20

logger:
  log_level: "debug"
  logs_directory: "./logs"
  file_base_name: "andychoir"
  max_file_size_bytes: 1048576
  days_to_keep: 3

history:
  max_events_per_session: 100
  dir: "./.andychour/sessions"
  current_session_file: "~/.andychour/current_session.json"
  session_ttl_secs: 604800
  save_period_secs: 1

# Нода A (фронт): слушает 8092, подключается к B (8093).
# Кольцо: A -> B -> C -> A.
net:
  node_id: "00000000-0000-0000-0000-0000000000a1"
  listen_port: 8092
  connect_retry_interval_secs: 10   # пауза между попытками (default 10)
  connect_timeout_secs: 300         # окно 5 мин; 0 = вечно
  token:
    - "secret-a"
  remotes:
    - url: "ws://127.0.0.1:8093/net"   # следующая нода в кольце: B
      token: "secret-b"
      targets: []                       # маршрутизация только по FIB (host:<node_id>:<tool>)
      retry_interval_secs: 0
      connect_timeout_secs: 0
